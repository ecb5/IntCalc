<article class="corollary theorem-like"><h2 class="heading">
<span class="type">Corollary</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">20.2.0.5</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">The Definite Integral.</span>
</h2>
<div class="para logical">
<div class="para">Suppose <span class="process-math">\(f(x) \)</span> is integrable on and interval <span class="process-math">\([a,b] \)</span> and suppose <span class="process-math">\(F(x) \)</span> be any antiderivative of <span class="process-math">\(f(x) \text{.}\)</span>  Then</div>
<div class="displaymath process-math">
\begin{equation*}
\int_{a}^{b}f(x)\dx{x} = F(b) - F(a).
\end{equation*}
</div>

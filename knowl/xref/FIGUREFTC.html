<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">20.2.0.5<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>       
<div class="para">Notice that since <span class="process-math">\(y\dx{x} =\dx{A}\)</span> the area of the box with width <span class="process-math">\(\dx{x} \)</span> and height <span class="process-math">\(y\)</span> in the diagram on the left is the same as the length <span class="process-math">\(\dx{A} \)</span> of the segment in the diagram on the right. If we add all of these together, the sum of the areas of the boxes in the  diagram on the left will provide the area of the region; the sum of the lengths of the segments in the  diagram on the right will provide the length of the segment from <span class="process-math">\(A(a)\)</span> to <span class="process-math">\(A(b)\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#FIGUREFTC-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para logical">
<div class="para">In other words, we have</div>
<div class="displaymath process-math">
\begin{equation*}
\int^b_{x=a}{y\dx{x} }=\int^b_{x=a}{\dx{A}
}=A\left(b\right)-A(a)
\end{equation*}
</div>
<div class="para">which is the Fundamental Theorem of Calculus.</div>

</div>
